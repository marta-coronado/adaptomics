<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -50 64 100">
  <style>
    .te {
      transform-box: fill-box;
      transform-origin: center;
      animation: 6s ease-in-out infinite both;
    }
    .te-cut { animation-name: cut; animation-duration: 12s; }
    .te-copy { animation-name: copy; animation-delay: 3s; }
    /* cut-and-paste: jumps down along the right, then back up along the left */
    @keyframes cut {
      0%, 12.5% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(20px, 15.7px) rotate(90deg); }
      27.5% { transform: translate(18px, 33.8px) rotate(160deg); }
      32.5%, 62.5% { transform: translate(0, 45.0px) rotate(180deg); }
      70% { transform: translate(-20px, 29.3px) rotate(270deg); }
      77.5% { transform: translate(-18px, 11.2px) rotate(340deg); }
      82.5%, 100% { transform: translate(0, 0) rotate(360deg); }
    }
    /* copy-and-paste: the original stays, each new copy decays slowly before the next one arrives */
    @keyframes copy {
      0%, 25% { transform: translate(0, 0); opacity: 0; }
      30% { opacity: 1; }
      40% { transform: translate(-20px, -15.7px) rotate(-90deg); }
      55% { transform: translate(-18px, -33.8px) rotate(-160deg); }
      65%, 75% { transform: translate(0, -45.0px) rotate(-180deg); opacity: 1; }
      100% { transform: translate(0, -45.0px) rotate(-180deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .te { animation: none; }
    }
  </style>
